name: status
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 11/29 0:00 JST 以降は取得しない
      - run: '[ "$(date -u +%Y%m%d%H)" -lt 2026112815 ] && python3 status.py || true'
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "update status" || exit 0
          git push
